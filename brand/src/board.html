<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Geist,Inter,system-ui,sans-serif;background:#07080c;color:#fff}
.mark{display:inline-block;color:currentColor}
.wm{display:flex;align-items:center;font-weight:700;letter-spacing:-.045em;line-height:1}
.chip{font:500 15px/1.35 "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;padding:14px 20px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px)}
.grid{background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px}
.frame{position:relative;overflow:hidden}
</style></head><body>
<div id="out"></div>
<script>
const MARK = s => `<svg class="mark" width="${s}" height="${s}" viewBox="0 0 64 64" fill="currentColor"><path fill-rule="evenodd" d="M32 3a29 29 0 1 1 0 58 29 29 0 0 1 0-58Zm0 7a22 22 0 1 0 0 44 22 22 0 0 0 0-44Z"/><path d="M32 32 L42.5 13.8 A21 21 0 0 1 53 32 Z"/><circle cx="21.5" cy="40.5" r="5" fill="#5ef0c4"/></svg>`;
const WM = (size, color) => `<div class="wm" style="font-size:${size}px;color:${color};gap:${size*.28}px">${MARK(size*1.05)}<span>radar<span style="opacity:.55;font-weight:600">signal</span></span></div>`;
const views = {
  banner: `<div class="frame" style="width:1280px;height:420px;background:radial-gradient(70% 120% at 85% 120%,#c06bff 0%,#6a3dff 28%,#2a2fb8 52%,#0b1240 78%,#05071a 100%)">
    <div class="grid" style="position:absolute;inset:0;mask-image:linear-gradient(180deg,#000,transparent 85%)"></div>
    <div style="position:absolute;top:36px;left:44px;display:flex;gap:10px"><div class="chip">Segnali swing<br>su Bitcoin</div><div class="chip" style="display:grid;place-items:center;padding:12px 16px;color:#fff">${MARK(30)}</div></div>
    <div style="position:absolute;top:36px;right:44px;display:flex;gap:10px"><div class="chip" style="font:600 38px Geist;letter-spacing:-.03em;text-transform:none;padding:12px 22px">89%</div><div class="chip">Win rate<br>[2022–26]</div></div>
    <div style="position:absolute;left:44px;bottom:40px">${WM(118,'#fff')}</div></div>`,
  icon: `<div style="width:1024px;height:1024px;background:radial-gradient(90% 90% at 70% 100%,#8b5cff 0%,#3d5bff 45%,#1a2a9e 75%,#0b1450 100%);display:grid;place-items:center;position:relative;overflow:hidden">
    <div class="grid" style="position:absolute;inset:0;background-size:128px 128px;opacity:.9"></div>
    <div style="color:#fff;position:relative;filter:drop-shadow(0 24px 60px rgba(10,20,80,.5))">${MARK(560)}</div></div>`,
  logoDark: `<div style="width:1200px;height:400px;background:#07080c;display:grid;place-items:center">${WM(110,'#fff')}</div>`,
  logoLight: `<div style="width:1200px;height:400px;background:#ffffff;display:grid;place-items:center">${WM(110,'#0b1130')}</div>`,
  board: `<div style="width:1600px;height:1000px;display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:1fr 1fr;gap:16px;padding:16px;background:#030409">
    <div class="frame" style="grid-row:span 2;border-radius:28px;background:radial-gradient(80% 90% at 80% 110%,#c06bff 0%,#6a3dff 30%,#2a2fb8 55%,#0b1240 80%,#05071a 100%)"><div class="grid" style="position:absolute;inset:0;mask-image:linear-gradient(180deg,#000,transparent)"></div>
      <div style="position:absolute;top:32px;left:32px;display:flex;gap:10px"><div class="chip">Radar Signal<br>BTC</div><div class="chip" style="display:grid;place-items:center">${MARK(28)}</div></div>
      <div style="position:absolute;left:36px;bottom:36px">${WM(96,'#fff')}</div></div>
    <div class="frame" style="border-radius:28px;background:#0b1450;display:grid;place-items:center"><div class="grid" style="position:absolute;inset:0"></div><div style="position:relative;display:flex;gap:40px;align-items:center">
      <div style="width:180px;height:180px;border-radius:42px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.4);background:radial-gradient(90% 90% at 70% 100%,#8b5cff,#3d5bff 45%,#1a2a9e 75%,#0b1450);display:grid;place-items:center;color:#fff">${MARK(100)}</div>
      <div style="display:grid;gap:14px">${["#3d5bff Signal Blue","#8b5cff Pulse Violet","#5ef0c4 Blip Mint","#07080c Night"].map(c=>{const [h,...n]=c.split(" ");return `<div style="display:flex;align-items:center;gap:14px"><span style="width:44px;height:44px;border-radius:14px;background:${h};border:1px solid rgba(255,255,255,.18)"></span><span style="font:500 15px 'Geist Mono';letter-spacing:.06em;text-transform:uppercase;opacity:.85">${n.join(" ")}<br><span style="opacity:.55">${h}</span></span></div>`}).join("")}</div></div></div>
    <div style="border-radius:28px;background:#f4f5f9;color:#0b1130;padding:36px;display:grid;align-content:space-between">
      ${WM(64,'#0b1130')}
      <div style="display:grid;gap:8px"><div style="font:700 72px/1 Geist;letter-spacing:-.04em">Aa 77.992</div><div style="font:500 16px 'Geist Mono';letter-spacing:.08em;text-transform:uppercase;opacity:.6">Geist · Geist Mono · Doto per i display numerici</div></div></div>
  </div>`,
};
document.getElementById("out").innerHTML = views[location.hash.slice(1)] || "";
</script></body></html>
