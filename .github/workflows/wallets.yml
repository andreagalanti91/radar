name: Sentinella wallet (Hyperliquid)

# (Quando attivo) ogni 5 minuti: posizioni e ordini dei 3 wallet osservati (data/wallets_watch.json), alert Telegram sui cambi (radar/wallets.py).
# Lo stato fra un giro e l'altro sta nella cache di Actions, non nel repository.
# Sentinella in pausa dal 22/11/2026 (richiesta dell'utente: sezione Wallet nascosta, niente notifiche): schedule tolto, resta l'avvio
# manuale. Per riprendere: rimettere `schedule: - cron: "*/5 * * * *"` e impostare le variabili RADAR_WALLETS=1, RADAR_WALLET_ALERTS=1.
on:
  workflow_dispatch:

concurrency:
  group: wallets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Stato precedente
        uses: actions/cache/restore@v4
        with:
          path: data/wallets_state.json
          key: wallets-state-${{ github.run_id }}
          restore-keys: wallets-state-
      - name: Controllo wallet
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_WALLET_MIN: ${{ vars.RADAR_WALLET_MIN || '50000' }}
          RADAR_WALLET_ORDER_MIN: ${{ vars.RADAR_WALLET_ORDER_MIN || '100000' }}
          RADAR_WALLET_ALERTS: ${{ vars.RADAR_WALLET_ALERTS || '0' }}
          RADAR_WALLETS: ${{ vars.RADAR_WALLETS || '0' }}
        run: python -m radar.wallets
      - name: Salva stato
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/wallets_state.json
          key: wallets-state-${{ github.run_id }}
