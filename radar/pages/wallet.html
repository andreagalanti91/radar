<!-- ============ WALLET · posizioni reali dell'utente ============
     Pagina separata (radar/pages/wallet.html), iniettata da radar/dashboard.py al posto del segnaposto PAGES del template.
     Accesso con Supabase Auth (email + password, nessuna registrazione dalla pagina); dati nelle tabelle wallet_posizioni e
     wallet_movimenti protette dalla RLS (supabase/schema.sql, supabase/LEGGIMI.md). URL e chiave pubblica: radar/wallet_config.json
     (o RADAR_SUPABASE_URL / RADAR_SUPABASE_ANON), scritti da dashboard.py al posto del segnaposto SUPABASE. Senza: "Wallet non ancora configurato".
     Client Supabase unico del tool: window.RadarAuth.client() (template, schermata di accesso globale AUTH_GATE); con il gate attivo
     l'accesso è già fatto e il modulo di accesso qui sotto resta solo per AUTH_GATE = false. window.WalletAPI serve il Profilo.
     Calcoli puri in window.WalletCalc (prezzo medio DCA, P/L, liquidazione stimata, leva massima, confronto con W3.2, statistiche; dal
     27/11/2026 anche dimensione da margine/quantità/valore, commissione stimata, strategia preselezionata, riepilogo prima di salvare,
     anteprima di Aumenta e Riduci, tasse per anno con compensazione e netto al mese, in euro ai cambi BCE della data delle operazioni:
     window.WalletFX, API pubblica Frankfurter con cache in localStorage), provati in tests/test_wallet.py.
     Azioni: "Apri posizione" (modulo a 3 passi), "Aumenta", "Riduci o chiudi", "Storico" (movimenti, Modifica, Elimina). Anteprima: ?demo=1 solo in locale (file:// o localhost), dati finti in memoria al posto di Supabase.
     Si registra in window.PAGES.wallet: init alla prima visita di #wallet, show/hide avviano e fermano l'aggiornamento dei prezzi. -->
<div class="view" id="v-wallet" hidden>
  <div class="section" id="waGate"><div class="card waGate"><span class="spin" aria-hidden="true"></span><span>Caricamento del Wallet…</span></div></div>
  <div class="waApp" id="waApp" hidden>
    <div class="section">
      <div class="sh">Il mio conto <small class="waWho"><span id="waUser"></span><button type="button" class="waCta ter sm" id="waOut" aria-label="Esci dall'account"><svg class="waI" aria-hidden="true"><use href="#i-out"/></svg><span>Esci</span></button></small></div>
      <div class="card waHero" id="waHero"></div>
    </div>
    <div class="section">
      <div class="sh">Posizioni aperte <button type="button" class="waCta pri" id="waNew" aria-label="Apri posizione"><svg class="waI" aria-hidden="true"><use href="#i-plus"/></svg><span>Apri posizione</span></button></div>
      <div class="waGrid" id="waOpen"></div>
    </div>
    <!-- confronto con la strategia: accordion chiuso di default (titolo + riassunto in una riga), si apre al tocco -->
    <details class="section waAcc" id="waCmpSec">
      <summary class="card"><span class="waAccT"><b>Confronto con la strategia</b><small id="waCmpSum">reale contro modello W3.2, stesso periodo</small></span><svg class="waAccC" aria-hidden="true"><use href="#i-chev"/></svg></summary>
      <p class="waNote waAccN">Reale contro modello W3.2 nello stesso periodo: percentuali sul valore della posizione, senza leva.</p>
      <div class="waGrid" id="waCmp"></div>
    </details>
    <div class="section" id="waClSec">
      <div class="sh">Posizioni chiuse <small id="waClSub"></small></div>
      <div class="big waStats" id="waStats"></div>
      <div class="list" id="waClosed"></div>
      <div class="waSubH" id="waTaxYH">Tasse stimate per anno <small>realizzato di tutte le posizioni</small></div>
      <div class="list" id="waTaxY"></div>
      <p class="waNote waAccN" id="waTaxN"></p>
    </div>
    <p class="foot" id="waFoot"></p>
  </div>
</div>

</style>
<script>
(function () {
  "use strict";
  const CFG = /*__SUPABASE__*/null;   // {url, anon} da radar/dashboard.py (radar/wallet_config.json); null = non configurato
  // supabase-js (versione esatta con SRI) e client unico: window.RadarAuth nel template (script "ACCESSO AL TOOL")
  const DEMO = /[?&]demo=1(&|$)/.test(location.search) && (location.protocol === "file:" || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname));
  const MMR = 0.005;   // mantenimento usato per la liquidazione stimata (margine isolato)

  // ---------------------------------------------------------------- calcoli puri (provati in tests/test_wallet.py)
  const ORD = { ingresso: 0, aggiunta: 1, riduzione: 2, chiusura: 3 };
  const t0 = d => { const x = Date.parse(d); return isFinite(x) ? x : 0; };
  const C = window.WalletCalc = {
    MMR,
    // numero scritto all'italiana o all'inglese: "2,80" "65.286,5" "65286.5" "1.234.567"; null se non è un numero
    parseNum(s) {
      if (typeof s === "number") return isFinite(s) ? s : null;
      let t = String(s == null ? "" : s).trim().replace(/\s|\$|€/g, "").replace(/[−–]/g, "-");
      if (!t) return null;
      if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
      else if ((t.match(/\./g) || []).length > 1 || /^-?[1-9]\d{0,2}\.\d{3}$/.test(t)) t = t.replace(/\./g, "");   // "66.100" = 66.100 (migliaia all'italiana); "0.125" resta decimale
      if (!/^-?\d*\.?\d+$/.test(t)) return null;
      const x = parseFloat(t); return isFinite(x) ? x : null;
    },
    // stato di una posizione dai suoi movimenti: prezzo medio ponderato degli ingressi e delle tranche (le riduzioni non lo cambiano),
    // quantità aperta, margine (quello inserito o prezzo×quantità/leva; le riduzioni lo scalano in proporzione), realizzato netto di
    // commissioni e funding, e la serie del realizzato per il calo massimo del conto
    posState(movs, lato, leva) {
      const sg = lato === "short" ? -1 : 1, lv = Math.max(1, +leva || 1);
      const M = (movs || []).slice().sort((a, b) => (t0(a.data) - t0(b.data)) || (ORD[a.tipo] - ORD[b.tipo]));
      let qty = 0, cost = 0, margin = 0, gross = 0, fees = 0, fund = 0, qIn = 0, costIn = 0, qOut = 0, valOut = 0, mIn = 0;
      let first = null, lastAdd = null, closedAt = null, nIn = 0;
      const ev = [];
      for (const m of M) {
        const p = +m.prezzo, q = +m.quantita, f = +m.commissioni || 0, fu = +m.funding || 0;
        let r = 0;
        fees += f; fund += fu;
        if (m.tipo === "ingresso" || m.tipo === "aggiunta") {
          const mg = m.margine != null && m.margine !== "" && isFinite(+m.margine) ? +m.margine : p * q / lv;
          qty += q; cost += p * q; qIn += q; costIn += p * q; margin += mg; mIn += mg; nIn++;
          first = first || m.data; lastAdd = m.data; closedAt = null;
        } else if (qty > 0) {
          const qq = Math.min(q, qty), avg = cost / qty;
          r = sg * (p - avg) * qq; gross += r;
          margin -= margin * qq / qty; cost -= avg * qq; qty -= qq; qOut += qq; valOut += p * qq;
          if (qty <= qIn * 1e-9) { qty = 0; cost = 0; margin = 0; closedAt = m.data; }
        }
        ev.push({ t: m.data, d: r - f - fu });
      }
      return { sg, qty, avg: qty > 0 ? cost / qty : (qIn ? costIn / qIn : null), avgIn: qIn ? costIn / qIn : null, avgOut: qOut ? valOut / qOut : null,
        margin, marginIn: mIn, gross, fees, funding: fund, realized: gross - fees - fund, qIn, qOut, nIn, first, lastAdd,
        last: M.length ? M[M.length - 1].data : null, closedAt: qty === 0 && qOut > 0 ? closedAt : null, open: qty > 0, n: M.length, ev };
    },
    // P/L non realizzato al prezzo px: in dollari, in % sul margine e movimento del prezzo dal prezzo medio
    pnl(st, px) {
      if (!st || !st.open || !(px > 0)) return { usd: 0, pctMargin: null, movePct: null };
      const usd = st.sg * (px - st.avg) * st.qty;
      return { usd, pctMargin: st.margin > 0 ? usd / st.margin * 100 : null, movePct: st.sg * (px / st.avg - 1) * 100 };
    },
    // liquidazione stimata a margine isolato: il margine meno la perdita arriva al mantenimento (mmr del valore).
    // Long: L = (medio − margine/q)/(1 − mmr); short: L = (medio + margine/q)/(1 + mmr). Spot e opzioni: nessuna liquidazione
    liqPrice(avg, qty, margin, lato, mercato, mmr) {
      mmr = mmr == null ? MMR : mmr;
      if (mercato !== "perp" || !(avg > 0) || !(qty > 0) || !(margin > 0)) return null;
      const L = lato === "short" ? (avg + margin / qty) / (1 + mmr) : (avg - margin / qty) / (1 - mmr);
      return L > 0 ? L : null;
    },
    // distanza in % dal prezzo attuale (positiva = sopra)
    dist: (lvl, px) => lvl > 0 && px > 0 ? (lvl / px - 1) * 100 : null,
    // leva massima compatibile con lo stop, stessa regola di radar/scanner.py lev_max: 1/(d + 0,05) per difetto a 0,5, tetto 10
    levMax(d) {
      if (d == null || !isFinite(d)) return null;
      const x = d + 0.05; if (x <= 0) return 10;
      const lv = 1 / x; if (lv >= 10) return 10;
      if (lv >= 1) return Math.floor(lv * 2 + 1e-9) / 2;
      return Math.max(0, Math.floor(lv * 10 + 1e-9) / 10);
    },
    // distanza dello stop dal prezzo medio, in frazione, dalla parte della perdita
    stopD: (avg, stop, lato) => avg > 0 && stop > 0 ? (lato === "short" ? (stop - avg) / avg : (avg - stop) / avg) : null,
    // operazione del modello che corrisponde alla posizione: data del segnale indicata, altrimenti quella attiva al primo ingresso
    modelFor(trades, segnale, first, lato) {
      if (!Array.isArray(trades)) return null;
      if (segnale) { const t = trades.find(x => x.signal === segnale); if (t) return t; }
      const d = String(first || "").slice(0, 10); if (!d) return null;
      const c = trades.filter(x => x.side === lato && x.signal <= d && (!x.exit || x.exit >= d));
      return c.length ? c[c.length - 1] : null;
    },
    // reale contro modello nello stesso periodo. Reale: risultato totale (realizzato + aperto, netto di costi) sul valore investito.
    // Modello: dal suo prezzo d'ingresso alla sua uscita se è uscito prima di te (o prima di oggi se sei ancora dentro), altrimenti al
    // tuo prezzo di uscita / al prezzo attuale. Deriva = reale − modello (punti %), anche in dollari sulla tua quantità
    compare(st, lato, model, px) {
      if (!st || !model || !(model.entry_px > 0) || !(st.avgIn > 0)) return null;
      const sg = lato === "short" ? -1 : 1, inv = st.avgIn * st.qIn;
      const unr = st.open && px > 0 ? sg * (px - st.avg) * st.qty : 0;
      const total = st.realized + unr, realPct = total / inv * 100;
      const endReal = st.open ? px : st.avgOut, endDay = st.open ? null : String(st.closedAt || "").slice(0, 10);
      const mClosed = !!(model.exit && model.exit_px > 0 && (st.open || (endDay && model.exit <= endDay)));
      const mEnd = mClosed ? model.exit_px : endReal;
      const modelPct = mEnd > 0 ? sg * (mEnd / model.entry_px - 1) * 100 : null;
      const dPx = sg * (model.entry_px - st.avgIn) / model.entry_px * 100;   // > 0: sei entrato a un prezzo migliore del modello
      const dDays = model.entry && st.first ? Math.round((Date.parse(String(st.first).slice(0, 10)) - Date.parse(model.entry)) / 864e5) : null;
      const drift = modelPct == null ? null : realPct - modelPct;
      return { realPct, realUsd: total, modelPct, modelUsd: modelPct == null ? null : modelPct / 100 * inv, drift,
        driftUsd: modelPct == null ? null : total - modelPct / 100 * inv, dPx, dDays, mClosed, sameSide: model.side === lato, costs: st.fees + st.funding };
    },
    // calo massimo del conto vero: capitale + realizzato cumulato a ogni movimento, più il non realizzato di oggi come ultimo punto
    ddMax(evs, capital, unrealNow) {
      const E = (evs || []).slice().sort((a, b) => t0(a.t) - t0(b.t)), c0 = capital > 0 ? capital : 0;
      let eq = c0, peak = c0, dd = 0, ddp = 0;
      const step = v => { eq = v; if (eq > peak) peak = eq; dd = Math.min(dd, eq - peak); if (peak > 0) ddp = Math.min(ddp, eq / peak - 1); };
      E.forEach(e => step(eq + e.d));
      if (unrealNow) step(eq + unrealNow);
      return { usd: dd, pct: c0 > 0 ? ddp * 100 : null };
    },
    // statistiche delle chiuse: vinte, risultato medio, quante seguono i segnali e con che risultato
    stats(closed) {
      const n = closed.length, res = closed.map(c => c.st.realized), inv = closed.map(c => c.st.avgIn * c.st.qIn);
      const sig = closed.filter(c => c.pos.strategia !== "fuori segnale"), off = closed.filter(c => c.pos.strategia === "fuori segnale");
      const sum = a => a.reduce((s, c) => s + c.st.realized, 0);
      return { n, wins: res.filter(x => x > 0).length, avgUsd: n ? res.reduce((s, x) => s + x, 0) / n : null,
        avgPct: n ? res.reduce((s, x, i) => s + (inv[i] > 0 ? x / inv[i] * 100 : 0), 0) / n : null,
        total: res.reduce((s, x) => s + x, 0), nSig: sig.length, sigUsd: sum(sig), nOff: off.length, offUsd: sum(off) };
    },
    // deriva totale in dollari delle posizioni confrontabili con il modello (riga chiusa dell'accordion "Confronto con la strategia")
    driftSum(cmps) { const v = (cmps || []).filter(c => c && c.driftUsd != null && isFinite(c.driftUsd));
      return { usd: v.reduce((s, c) => s + c.driftUsd, 0), n: v.length }; },
    // esportazione CSV (Profilo → Dati): una riga per movimento con i dati della sua posizione, più le posizioni senza movimenti.
    // Formato italiano per Excel: separatore ";", virgola decimale, date ISO; BOM iniziale per l'UTF-8
    toCSV(pos, mov) {
      const H = ["posizione", "moneta", "lato", "mercato", "leva", "exchange", "strategia", "data_segnale", "stato", "tipo", "data", "prezzo", "quantita", "margine", "commissioni", "funding", "note_movimento", "note_posizione"];
      const num = x => x == null || x === "" || !isFinite(+x) ? "" : String(+x).replace(".", ",");
      const cell = x => { const t = x == null ? "" : String(x); return /[;"\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
      const rows = [];
      (pos || []).slice().sort((a, b) => t0(a.created_at) - t0(b.created_at)).forEach(p => {
        const P = [p.id, p.asset, p.lato, p.mercato, num(p.leva), p.exchange, p.strategia, p.segnale_data || "", p.stato];
        const M = (mov || []).filter(m => m.posizione_id === p.id).sort((a, b) => (t0(a.data) - t0(b.data)) || (ORD[a.tipo] - ORD[b.tipo]));
        if (!M.length) rows.push(P.concat(["", "", "", "", "", "", "", "", p.note || ""]));
        M.forEach(m => rows.push(P.concat([m.tipo, m.data, num(m.prezzo), num(m.quantita), num(m.margine), num(m.commissioni), num(m.funding), m.note || "", p.note || ""])));
      });
      return "\ufeff" + [H].concat(rows).map(r => r.map(cell).join(";")).join("\r\n") + "\r\n";
    },
    // risultato di oggi (24 h): realizzato con data di oggi + variazione del non realizzato dall'apertura di 24 h fa
    // (dal prezzo medio se la posizione ha avuto ingressi nelle ultime 24 h)
    today(items, now) {
      now = now || Date.now();
      const day = new Date(now).toDateString();
      let r = 0, ok = true;
      items.forEach(({ st, px, open24 }) => {
        st.ev.forEach(e => { if (new Date(e.t).toDateString() === day) r += e.d; });
        if (!st.open || !(px > 0)) return;
        const recent = st.lastAdd && now - t0(st.lastAdd) < 864e5;
        const base = recent ? st.avg : open24;
        if (!(base > 0)) { ok = false; return; }
        r += st.sg * (px - base) * st.qty;
      });
      return { usd: r, complete: ok };
    },

    // ---- Apri posizione, Aumenta, Riduci o chiudi, tasse (27/11/2026)
    // commissione taker stimata in %, livello base pubblicato (Bitget perp 0,06%, OKX perp 0,05%, spot 0,1%): stima modificabile nel modulo
    FEE: { Bitget: { perp: 0.06, spot: 0.1 }, OKX: { perp: 0.05, spot: 0.1 }, altro: { perp: 0.06, spot: 0.1 } },
    feeRate(ex, mercato) { const t = C.FEE[ex] || C.FEE.altro; return mercato === "spot" ? t.spot : t.perp; },
    fee: (value, ratePct) => value > 0 && ratePct > 0 ? value * ratePct / 100 : 0,
    // dimensione da un solo importo: margine $ (valore = margine × leva), quantità (valore = q × prezzo) o valore $ della posizione;
    // gli altri due si ricavano con la leva (spot: leva 1)
    size(by, val, lev, px) {
      lev = Math.max(1, +lev || 1);
      if (!(val > 0) || !(px > 0)) return null;
      const value = by === "quantita" ? val * px : by === "valore" ? val : val * lev;
      return { value, margin: value / lev, qty: value / px, lev };
    },
    // strategia preselezionata: W3.2 se BTC/ETH e il lato coincide con la posizione aperta del modello; Scanner se la moneta ha un
    // segnale dello Scanner nello stesso lato; altrimenti fuori segnale. W = stato W3.2 della moneta (null per le altcoin), row = riga Scanner
    preStrategy(lato, W, row) {
      if (W) return W.status === "aperto" && W.side === lato ? { strategia: "W3.2", segnale: W.signal_date || null } : { strategia: "fuori segnale", segnale: null };
      if (row && row.lato === lato && (lato === "long" || lato === "short")) return { strategia: "scanner", segnale: row.sig || null };
      return { strategia: "fuori segnale", segnale: null };
    },
    // riepilogo prima di salvare: valore, margine, commissione, liquidazione e stop con la distanza dal prezzo d'ingresso, leva massima
    // compatibile con lo stop (o quella dello Scanner se lo stop manca), risultato allo stop con le commissioni di entrata e uscita, peso sul capitale
    plan(o) {
      const px = +o.px, qty = +o.qty, lev = Math.max(1, +o.lev || 1), sg = o.lato === "short" ? -1 : 1;
      const value = px * qty, margin = o.margin > 0 ? +o.margin : value / lev, fee = C.fee(value, o.feeRate);
      const liq = C.liqPrice(px, qty, margin, o.lato, o.mercato), stop = o.stop > 0 ? +o.stop : null;
      const sd = stop ? C.stopD(px, stop, o.lato) : null, levMax = sd != null ? C.levMax(sd) : o.levMax != null ? +o.levMax : null;
      const atStop = stop ? sg * (stop - px) * qty - fee - C.fee(stop * qty, o.feeRate) : null, cap = o.capital > 0 ? +o.capital : null;
      return { value, margin, fee, liq, liqD: C.dist(liq, px), stop, stopD: C.dist(stop, px), levMax, levOver: levMax != null && lev > levMax + 1e-9,
        liqFirst: !!(liq && stop && (o.lato === "short" ? liq < stop : liq > stop)), atStop, riskPct: cap && atStop != null ? atStop / cap * 100 : null,
        weight: cap ? margin / cap * 100 : null, expo: cap ? value / cap * 100 : null };
    },
    // Aumenta: nuovo prezzo medio, quantità, margine e liquidazione dopo l'aggiunta
    addPreview(st, px, qty, margin, lato, mercato) {
      if (!st || !(px > 0) || !(qty > 0)) return null;
      const Q = st.qty + qty, avg = (st.avg * st.qty + px * qty) / Q, M = st.margin + (margin > 0 ? margin : 0);
      return { avg, qty: Q, margin: M, dAvg: st.avg > 0 ? (avg / st.avg - 1) * 100 : null,
        liq: C.liqPrice(avg, Q, M, lato, mercato), liqNow: C.liqPrice(st.avg, st.qty, st.margin, lato, mercato) };
    },
    qtyOfPct: (open, pct) => open > 0 && pct > 0 ? (pct >= 100 ? open : open * pct / 100) : null,
    // Riduci o chiudi: quantità che esce, P/L realizzato lordo, commissione stimata, netto, quantità e margine che restano
    reducePreview(st, px, qty, feeRate) {
      if (!st || !(st.qty > 0) || !(px > 0) || !(qty > 0)) return null;
      const qq = Math.min(qty, st.qty), gross = st.sg * (px - st.avg) * qq, fee = C.fee(px * qq, feeRate), rest = st.qty - qq;
      const full = rest <= st.qty * 1e-9;
      return { qty: qq, value: px * qq, gross, fee, net: gross - fee, rest: full ? 0 : rest, marginRest: full ? 0 : st.margin * rest / st.qty, full, pct: qq / st.qty * 100 };
    },
    // aliquota sulle plusvalenze in %: quella del profilo (user_metadata.aliquota) se c'è, altrimenti 33% dal 2026 e 26% fino al 2025 (Italia)
    taxRate(aliq, year) { const a = aliq == null || aliq === "" ? NaN : +aliq; return isFinite(a) && a >= 0 && a <= 100 ? a : (year >= 2026 ? 33 : 26); },
    // tasse per anno solare sul realizzato (netto di commissioni e funding): le perdite dell'anno compensano i guadagni dello stesso anno,
    // si paga solo sul saldo positivo; minusvalenze riportate agli anni dopo non gestite. Netto al mese = netto dell'anno / 12
    taxYears(evs, aliq) {
      const Y = {};
      (evs || []).forEach(e => { const t = t0(e.t); if (!t || !isFinite(e.d) || !e.d) return; const y = new Date(t).getFullYear();
        const o = Y[y] || (Y[y] = { year: y, gains: 0, losses: 0 }); if (e.d > 0) o.gains += e.d; else o.losses += e.d; });
      return Object.values(Y).sort((a, b) => b.year - a.year).map(o => {
        const net = o.gains + o.losses, rate = C.taxRate(aliq, o.year), tax = Math.max(0, net) * rate / 100;
        return Object.assign(o, { net, rate, tax, after: net - tax, monthly: (net - tax) / 12 }); });
    },
    // "se chiudessi oggi": realizzato dell'anno + non realizzato, con la stessa compensazione; extra = tasse in più rispetto al solo realizzato
    taxIfClosed(yearNet, unreal, rate) {
      const pre = (+yearNet || 0) + (+unreal || 0), tax = Math.max(0, pre) * rate / 100, now = Math.max(0, +yearNet || 0) * rate / 100;
      return { pre, tax, after: pre - tax, monthly: (pre - tax) / 12, extra: tax - now };
    },
    // ---- tasse in euro ai cambi di riferimento BCE (27/11/2026)
    // giorno "AAAA-MM-GG" di una data ISO (le date dei movimenti sono timestamp UTC)
    fxDay: d => { const m = /^(\d{4}-\d{2}-\d{2})/.exec(String(d || "")); return m ? m[1] : null; },
    // cambio USD→EUR (euro per 1 $) del giorno d da una tabella { "AAAA-MM-GG": cambio }: weekend e festivi = ultimo cambio precedente
    fxAt(tab, d) {
      const day = C.fxDay(d); if (!tab || !day) return null;
      if (tab[day] > 0) return { date: day, rate: +tab[day] };
      let best = null; for (const k in tab) if (k <= day && tab[k] > 0 && (!best || k > best)) best = k;
      return best ? { date: best, rate: +tab[best] } : null;
    },
    // eventi fiscali in euro di una posizione (stima): per ogni riduzione o chiusura spot long, plusvalenza = corrispettivo al cambio
    // della data di uscita − costo medio ponderato in euro (ogni ingresso al cambio della sua data); per perp e short, risultato in $
    // della riduzione al cambio della data di chiusura (approssimazione). Commissioni e funding al cambio della loro data.
    // rateOf(d) = euro per 1 $ nel giorno d, o null; missing = almeno un movimento senza cambio
    eurEvents(movs, lato, mercato, rateOf) {
      const sg = lato === "short" ? -1 : 1, spot = mercato === "spot" && sg === 1;
      const M = (movs || []).slice().sort((a, b) => (t0(a.data) - t0(b.data)) || (ORD[a.tipo] - ORD[b.tipo]));
      let qty = 0, cost = 0, costEur = 0, qIn = 0, missing = false;
      const ev = [];
      for (const m of M) {
        const p = +m.prezzo, q = +m.quantita, f = (+m.commissioni || 0) + (+m.funding || 0), fx = rateOf(m.data);
        if (!(fx > 0)) { missing = true; continue; }
        let g = 0, usd = 0;
        if (m.tipo === "ingresso" || m.tipo === "aggiunta") { qty += q; cost += p * q; costEur += p * q * fx; qIn += q; }
        else if (qty > 0) {

    // confronto
    const cmpL = L.filter(x => x.st.qIn > 0).sort((a, b) => ((a.pos.strategia === "fuori segnale") - (b.pos.strategia === "fuori segnale")) || (b.st.open - a.st.open) || (t0(b.st.first) - t0(a.st.first)));   // fuori segnale in fondo
    $w("waCmp").innerHTML = cmpL.length ? cmpL.map(cmpHtml).join("") : `<div class="card waEmpty waOne">Nessuna posizione da confrontare.</div>`;

    const D = C.driftSum(cmpL.map(x => x.sx.model ? C.compare(x.st, x.pos.lato, x.sx.model, x.q && x.q.px) : null));

      ${store.demo ? " <b>Anteprima con dati finti in memoria.</b>" : " Dati su Supabase, visibili solo al tuo account."}${empty.length ? ` ${empty.length} posizion${empty.length === 1 ? "e" : "i"} senza movimenti: <button type="button" class="waLink" id="waEmptyP">vedi</button>` : ""}`;

  }

  // cambi per gli anni dei movimenti: subito quelli in cache (sincrono), poi la richiesta alla rete e un nuovo render
  let FXS = null, fxReq = "", fxAt0 = 0;
  function fxFor(years) {
    const k = years.slice().sort().join(","), now = Date.now();
    if (fxReq !== k || now - fxAt0 > FX.TTL) {
      fxReq = k; fxAt0 = now;
      FX.load(years).then(r => { if (fxReq === k) { FXS = r; render(); } }).catch(() => {});
    }
    if (FXS && FXS.years.join(",") === k) return { fx: FXS, loading: false };
    const tab = {}; let all = true; years.forEach(y => { const v = FX.read(y); if (v) Object.assign(tab, v.rates); else all = false; });
    const keys = Object.keys(tab).sort(), d = keys[keys.length - 1];
    return { fx: { tab, ok: all && !!d, any: !!d, fallback: false, last: d ? { date: d, rate: tab[d] } : null, years }, loading: true };
  }
  // tasse per anno in euro (eur = { rate, date } del cambio di oggi) oppure in dollari se manca anche un solo cambio
  function taxCalc(L, aliq, unr, yNow) {
    const years = [...new Set(MOV.map(m => +String(C.fxDay(m.data) || "").slice(0, 4)).filter(y => y >= 2000 && y <= yNow).concat([yNow]))];
    const { fx, loading } = fxFor(years), rateOf = d => { const r = C.fxAt(fx.tab, d); return r ? r.rate : null; };
    const today = C.fxAt(fx.tab, new Date().toISOString().slice(0, 10));
    let eur = null, evs;
    if (fx.ok && today) {
      const EV = L.map(x => C.eurEvents(movsOf(x.pos.id), x.pos.lato, x.pos.mercato, rateOf));
      if (!EV.some(r => r.missing)) { eur = today; evs = [].concat(...EV.map(r => r.ev)); }
    }
    if (!eur) evs = [].concat(...L.map(x => x.st.ev));
    const TY = C.taxYears(evs, aliq);
    const Ty = TY.find(t => t.year === yNow) || { year: yNow, gains: 0, losses: 0, net: 0, tax: 0, after: 0, monthly: 0, rate: C.taxRate(aliq, yNow) };
    return { TY, Ty, TC: C.taxIfClosed(Ty.net, unr * (eur ? eur.rate : 1), Ty.rate), eur, fx, loading: loading && !eur };
  }

  // aliquota sulle plusvalenze dal profilo (user_metadata.aliquota, in %); null = predefinita (33% dal 2026, 26% fino al 2025)
  const aliqOf = u => { const a = u && u.user_metadata ? u.user_metadata.aliquota : null; return a == null || a === "" || !isFinite(+a) ? null : +a; };

      <p class="waNote"><b>In euro, ai cambi BCE.</b> Ogni operazione si converte al cambio di riferimento BCE del suo giorno (sabato, domenica e festivi: l'ultimo cambio precedente). Spot: plusvalenza = incasso in euro al cambio dell'uscita − costo medio in euro degli ingressi, ciascuno al cambio della sua data. Perp: il risultato in dollari della riduzione è convertito al cambio della chiusura (approssimazione). Commissioni e funding al cambio della loro data.${eur ? ` Ultimo cambio: ${fDM(eur.date)}, 1\u00a0$\u00a0=\u00a0${nf(eur.rate, 4)}\u00a0€.` : " Ora il cambio non è disponibile: importi in dollari."}</p>
      <p class="waNote"><b>Compensazione nell'anno.</b> Le tasse si stimano solo sul saldo netto positivo in euro dell'anno solare: le perdite dell'anno compensano i guadagni dello stesso anno. Le minusvalenze riportabili agli anni successivi non sono gestite.</p>
      <p class="waNote"><b>Cosa entra.</b> Il realizzato di riduzioni e chiusure, al netto di commissioni e funding. Netto = profitto lordo − tasse; netto al mese = netto dell'anno / 12. "Se chiudessi oggi" aggiunge il risultato aperto al prezzo attuale, convertito al cambio di oggi, senza le commissioni di uscita.</p>
      <p class="waNote">Cambi: Frankfurter (dati BCE), salvati sul dispositivo per non ripetere le richieste.</p>
      <p class="waNote">Stima, non consulenza fiscale.</p>
      <div class="bar"><a class="waCta ter" href="#profilo" aria-label="Cambia l'aliquota nel Profilo"><svg class="waI" aria-hidden="true"><use href="#i-user"/></svg><span>Cambia l'aliquota nel Profilo</span></a></div></div>`);
  }

  function cardHtml(x) {

    if (sx.lev != null && +p.leva > sx.lev) warns.push(`<p class="waWarn">${WARN}<span>Leva ${fLev(p.leva)} oltre la massima compatibile con lo ${sx.levSrc === "Scanner" ? "stop dello Scanner" : "stop"} (${fLev(sx.lev)}): la liquidazione arriva prima dello stop.</span></p>`);
    if (liq && px && sx.stop && (p.lato === "short" ? liq < sx.stop : liq > sx.stop) && !(sx.lev != null && +p.leva > sx.lev)) warns.push(`<p class="waWarn">${WARN}<span>La liquidazione stimata (${fPx(liq)}) è prima dello stop ${sx.stopSrc === "Scanner" ? "dello Scanner" : "W3.2"}.</span></p>`);
    if (dL != null && Math.abs(dL) < 10) warns.push(`<p class="waWarn red">${WARN}<span>Liquidazione vicina: ${fPct(dL)} dal prezzo.</span></p>`);
    if (p.strategia === "W3.2" && sx.flat) warns.push(`<p class="waWarn">${WARN}<span>La strategia W3.2 su ${esc(p.asset)} non ha una posizione aperta: questa resta senza stop del modello.</span></p>`);
    else if (p.strategia === "W3.2" && !sx.stop && Wof(p.asset)) warns.push(`<p class="waWarn">${WARN}<span>W3.2 su ${esc(p.asset)} è ${Wof(p.asset).side} : la posizione è nel verso opposto al segnale.</span></p>`);

      : cmp ? `<p class="waNote">Segnale ${esc(p.strategia)} ${artDay(sx.model.signal)} · deriva <b class="${cls(cmp.drift)}">${fPct(cmp.drift)}</b> (${fUsd(cmp.driftUsd, true)}) rispetto al modello</p>`

        <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><span class="waTag ${p.lato}">${p.lato}</span>${tag}</span></div>
      <div class="waPl"><b class="${cls(pl.usd)}">${px ? fUsd(pl.usd, true) : "–"}</b><span><span class="${cls(pl.usd)}">${pl.pctMargin != null ? fPct(pl.pctMargin) + " sul margine" : ""}</span>${pl.movePct != null ? " · prezzo " + fPct(pl.movePct) : ""}${st.realized ? ` · ${st.gross ? "realizzato" : "costi"} ${fUsd(st.realized, true)}` : ""}</span></div>
      <div class="kvs">
        <div><span>prezzo medio</span><b>${fPx(st.avg)}</b><small>${st.nIn > 1 ? st.nIn + " ingressi" : "1 ingresso"}</small></div>
        <div><span>prezzo attuale</span><b>${fPx(px)}</b><small>${pxSub}</small></div>
        <div><span>quantità</span><b>${fQty(st.qty)}</b><small>${esc(p.asset)}</small></div>
        <div><span>margine</span><b>${fUsd(st.margin)}</b><small>leva ${fLev(p.leva)}</small></div>
        <div><span>liquidazione stimata</span><b>${liq ? fPx(liq) : "–"}</b><small>${liq ? (dL != null ? fPct(dL) + " dal prezzo" : "") : p.mercato === "perp" ? "margine non indicato" : "senza leva"}</small></div>
        ${seventh}
      </div>
      ${warns.join("")}${line}
      <div class="waAct">${cta("sec", 'data-a="add"', "plus", "Aumenta", "", "Aumenta la posizione")}${cta("sec", 'data-a="red"', "minus", "Riduci o chiudi", "", "Riduci o chiudi la posizione")}${cta("ter", 'data-a="movs"', "list", "Storico", "", "Storico della posizione")}</div>
    </article>`;

  const artDay = d => window.artD ? window.artD("del", fDay(d)) : "del " + fDay(d);

  function cmpHtml(x) {
    const { pos: p, st, sx, q } = x, px = q && q.px;
    const head = `<div class="waTop"><div><b class="t">${esc(nameOf(p.asset))} · ${p.lato}</b><small>${st.open ? "aperta dal " + fDay(st.first) : `chiusa · ${fDayY(st.first)} → ${fDayY(st.closedAt)}`}</small></div>`;
    if (p.strategia === "fuori segnale") return `<div class="card waCmp">${head}<span class="waTag off">fuori segnale</span></div>
      <p class="waNote">Posizione aperta senza segnale: non c'è un risultato del modello da confrontare.${sx.lev != null ? ` Leva massima compatibile con lo stop dello Scanner: <b>${fLev(sx.lev)}</b>.` : ""}</p></div>`;
    const cmp = sx.model ? C.compare(st, p.lato, sx.model, px) : null;
    if (!cmp) return `<div class="card waCmp">${head}<span class="waTag sig">${esc(p.strategia)}</span></div><p class="waNote">Nessun segnale ${esc(p.strategia)} attivo alla data del primo ingresso${p.segnale_data ? " né alla data indicata (" + fDay(p.segnale_data) + ")" : ""}.</p></div>`;
    const M = sx.model, better = cmp.dPx >= 0, dd = cmp.dDays;
    const why = [];
    if (Math.abs(cmp.dPx) >= 0.05) why.push(`ingresso ${better ? "migliore" : "peggiore"} del ${nf(Math.abs(cmp.dPx), 1)}%`);
    if (cmp.costs > 0.5) why.push(`costi ${fUsd(cmp.costs)}`);
    if (!cmp.mClosed && !st.open && M.exit == null) why.push("uscita prima del modello");
    if (cmp.mClosed && st.open) why.push("il modello è già uscito");
    return `<div class="card waCmp">${head}<span class="waTag sig">${esc(p.strategia)}</span></div>
      ${cmp.sameSide ? "" : `<p class="waWarn">${WARN}<span>Lato opposto al segnale del modello (${esc(M.side)}).</span></p>`}

  // legge e controlla il movimento; restituisce {m} o {err}
  function readMov(f, tipo, lev, st, ref, editId) {
    const P = C.parseNum, prezzo = P(f.prezzo.value), qIn = P(f.quantita.value), mg = f.margine ? P(f.margine.value) : null;
    const comm = P(f.commissioni.value) || 0, fund = f.funding ? P(f.funding.value) || 0 : 0, dt = f.data.value ? new Date(f.data.value) : null;
    if (!dt || isNaN(dt)) return { err: "Data non valida." };
    if (dt.getTime() > Date.now() + 36e5) return { err: "La data è nel futuro." };
    if (!(prezzo > 0)) return { err: "Prezzo mancante o non valido." };
    let q = qIn;
    if (!(q > 0) && mg > 0 && f.margine) q = mg * lev / prezzo;
    if (!(q > 0)) return { err: f.margine ? "Inserisci la quantità oppure il margine." : "Quantità mancante o non valida." };
    if (f.margine && f.margine.value.trim() && !(mg >= 0)) return { err: "Margine non valido." };
    if (comm < 0) return { err: "Le commissioni non possono essere negative." };
    if ((tipo === "riduzione" || tipo === "chiusura") && st) {

    }
    const far = ref > 0 && Math.abs(prezzo / ref - 1) > 0.5 && Date.now() - dt.getTime() < 7 * 864e5;
    return { m: { tipo, data: dt.toISOString(), prezzo, quantita: +q.toPrecision(12), margine: f.margine ? (mg > 0 ? mg : null) : undefined, commissioni: comm, funding: fund, note: f.note.value.trim() || null }, far };

  function movPreview(f, tipo, pos, st) {

    if (!(pr > 0) || !(q > 0)) { box.innerHTML = "Valore e prezzo medio si calcolano mentre scrivi."; return; }

      const em = isEmerg(p.asset), EB = em ? C.emergBudget(emergOpen(), sz.margin, capital) : null, sig = f.segnale_data.value;
      const tile = (k, v, s, c) => `<div><span>${k}</span><b class="${c || ""}">${v}</b><small>${s}</small></div>`;
      const warns = [];
      if (Pl.levOver) warns.push(`<p class="waWarn">${WARN}<span>Leva ${fLev(d.lev)} oltre la massima compatibile con lo stop (${fLev(Pl.levMax)}): la liquidazione arriverebbe prima dello stop.</span></p>`);
      else if (Pl.liqFirst) warns.push(`<p class="waWarn">${WARN}<span>La liquidazione stimata (${fPx(Pl.liq)}) arriva prima dello stop (${fPx(Pl.stop)}).</span></p>`);
      if (Pl.liqD != null && Math.abs(Pl.liqD) < 10) warns.push(`<p class="waWarn red">${WARN}<span>Liquidazione vicina: ${fPct(Pl.liqD)} dal prezzo d'ingresso.</span></p>`);
      if (EB && EB.over) warns.push(`<p class="waWarn red">${WARN}<span>Moneta emergente: con questa posizione il margine sulle emergenti arriva a ${fUsd(EB.total)}, oltre l'1% del capitale (${fUsd(EB.limit)}). Regola: al massimo l'1%.</span></p>`);
      else if (em && !capital) warns.push(`<p class="waWarn">${WARN}<span>Moneta emergente: imposta il capitale per controllare la regola dell'1%.</span></p>`);
      q("[data-sum]").innerHTML = `<div class="waSumTop">${coinIco(p.asset)}<div><b>${esc(nameOf(p.asset))} · ${p.lato === "short" ? "Short" : "Long"} ${fLev(d.lev)}</b>
          <small>${p.mercato === "spot" ? "Spot" : "Perp"} · ${esc(p.exchange === "altro" ? "altro exchange" : p.exchange)} · ${p.strategia === "fuori segnale" ? "fuori segnale" : esc(p.strategia === "scanner" ? "Scanner" : "W3.2") + (sig ? " " + artDay(sig) : "")} · ingresso ${fPx(d.px)}</small></div></div>
        <div class="kvs waSumG">
          ${tile("valore della posizione", fUsd(Pl.value), `${fQty(sz.qty)} ${esc(p.asset)}`)}
          ${tile("margine", fUsd(Pl.margin), p.mercato === "spot" ? "spot, senza leva" : "leva " + fLev(d.lev))}
          ${tile("liquidazione stimata", Pl.liq ? fPx(Pl.liq) : "–", Pl.liq ? fPct(Pl.liqD) + " dall'ingresso" : p.mercato === "spot" ? "nessuna in spot" : "oltre lo zero")}
          ${tile("stop della strategia", Pl.stop ? fPx(Pl.stop) : "–", Pl.stop ? `${fPct(Pl.stopD)} · ${esc(so.src)}` : "nessuno stop di riferimento")}
          ${tile("leva massima con lo stop", Pl.levMax != null ? fLev(Pl.levMax) : "–", Pl.levMax != null ? (Pl.levOver ? "superata: la tua è " + fLev(d.lev) : "la tua: " + fLev(d.lev)) : "senza stop", Pl.levOver ? "neg" : "")}
          ${tile("rischio allo stop", Pl.atStop != null ? fUsd(Pl.atStop, true) : "–", Pl.atStop != null ? (Pl.riskPct != null ? fPct(Pl.riskPct, 2) + " del capitale · " : "") + "commissioni incluse" : `senza stop: fino al margine, ${fUsd(Pl.margin)}`, cls(Pl.atStop))}
          ${tile("peso sul capitale", Pl.weight != null ? fPctU(Pl.weight) : "–", Pl.weight != null ? `margine su ${fUsd(capital)} · esposizione ${fPctU(Pl.expo)}` : "imposta il capitale")}
          ${tile("commissione stimata", fUsd(Pl.fee), `${nf(d.rate, 2)}% del valore`)}
          ${em ? tile("moneta emergente", EB.limit != null ? fUsd(EB.total) : "sì", EB.limit != null ? `margine sulle emergenti, limite ${fUsd(EB.limit)} (1% del capitale)` : "regola: massimo 1% del capitale", EB.over ? "neg" : "") : ""}
        </div>
        ${warns.join("")}
        <p class="waNote">Stime: liquidazione a margine isolato con mantenimento ${nf(MMR * 100, 1)}%, commissione taker stimata, rischio allo stop con le commissioni di entrata e uscita. I valori veri dipendono dall'exchange.</p>`;
    };
    const go = n => {
      S.step = n; errOut(f, "");
      f.querySelectorAll("[data-step]").forEach(x => { x.hidden = +x.dataset.step !== n; });
      f.querySelectorAll("[data-st]").forEach(li => { const k = +li.dataset.st; li.classList.toggle("done", k < n); if (k === n) li.setAttribute("aria-current", "step"); else li.removeAttribute("aria-current"); });
      q("[data-back]").textContent = n === 1 ? "Annulla" : "Indietro";
      q("[data-next]").textContent = n === 3 ? "Apri posizione" : "Avanti";
      if (n === 2) { const p = P(); q("[data-what]").innerHTML = `<div class="waSumTop">${coinIco(p.asset)}<div><b>${esc(nameOf(p.asset))} · ${p.lato === "short" ? "Short" : "Long"}</b><small>${p.mercato === "spot" ? "Spot" : "Perp"} · ${esc(p.exchange === "altro" ? "altro exchange" : p.exchange)} · ${esc(p.strategia === "scanner" ? "Scanner" : p.strategia)}</small></div></div>`;
        paintSrc(); upd2(); needPx(p.asset, () => { if (f.isConnected && P().asset === p.asset) { paintSrc(); upd2(); } }); }
      if (n === 3) sumPaint();
      const b = f.closest(".dlgBody") || f.parentNode; if (b && b.parentNode && b.parentNode.scrollTo) b.parentNode.scrollTo({ top: 0 });
    };
    const check1 = () => { const p = P(), W = Wof(p.asset);
      if (!/^[A-Z0-9]{1,15}$/.test(p.asset)) return "Moneta: solo lettere e numeri (es. BTC, ETH, PIEVERSE).";
      if (p.lato === "short" && p.mercato === "spot") return "Lo short in spot non è possibile: scegli Perp.";
      if (p.strategia === "W3.2" && !W) return "W3.2 esiste solo per BTC ed ETH: scegli Scanner o Fuori segnale.";
      return null; };
    const check2 = () => { const e = dateErr(f) || qtyCheck(qtyRead(f)); return e; };
    // eventi
    paintCoins(); upd1(); go(1);
    if (window.lazyPending && window.lazyPending("scanner")) window.lazyData("scanner").then(() => { if (f.isConnected) { paintCoins(); upd1(); } }).catch(() => {});
    f.asset.oninput = () => { S.pxT = false; upd1(); };
    f.querySelectorAll("[data-side]").forEach(b => b.onclick = () => { S.lato = b.dataset.side; upd1(); });
    segWire(f, (n, v) => {
      if (n === "strategia") { S.auto = false; const p = P(), W = Wof(p.asset), r = scanRow(p.asset);
        f.segnale_data.value = v === "W3.2" && W && W.status === "aperto" && W.side === S.lato ? W.signal_date || "" : v === "scanner" && r && r.lato === S.lato ? r.sig || "" : ""; upd1(); }
      else if (n === "mercato" || n === "exchange") { upd1(); if (S.step === 2) upd2(); }
      else if (n === "by") { f.importo.value = ""; upd2(); }
    });
    f.querySelectorAll("[data-lev]").forEach(b => b.onclick = () => { f.leva.value = b.dataset.lev; upd2(); });
    f.addEventListener("input", e => { const n = e.target.name;
      if (n === "prezzo") S.pxT = true; if (n === "fee") S.feeT = true;
      if (S.step === 2 && n !== "asset") upd2(); });
    q("[data-back]").onclick = () => S.step === 1 ? window.closeSheet() : go(S.step - 1);
    f.onsubmit = e => {
      e.preventDefault();
      if (S.step === 1) { const er = check1(); return er ? errOut(f, er) : go(2); }
      if (S.step === 2) {
        const er = check2(); if (er) return errOut(f, er);
        const d = qtyRead(f), x = pxOf(P().asset), dt = new Date(f.data.value);
        const far = x && x.px > 0 && Math.abs(d.px / x.px - 1) > 0.5 && Date.now() - dt.getTime() < 7 * 864e5;
        if (far && S.far !== f.prezzo.value) { S.far = f.prezzo.value; return errOut(f, `Prezzo lontano oltre il 50% da quello attuale (${fPx(x.px)}): controlla le cifre e premi di nuovo Avanti.`, true); }
        return go(3);
      }
      const p = P(), d = qtyRead(f), dt = new Date(f.data.value);
      save(f, () => store.addPos({ asset: p.asset, lato: p.lato, mercato: p.mercato, leva: p.mercato === "perp" ? d.lev : 1, exchange: p.exchange, strategia: p.strategia,
        stato: "aperta", segnale_data: f.segnale_data.value || null, note: null },
        { tipo: "ingresso", data: dt.toISOString(), prezzo: d.px, quantita: +d.sz.qty.toPrecision(12), margine: +d.sz.margin.toFixed(2), commissioni: +d.fee.toFixed(4), funding: 0, note: f.note.value.trim() || null }));
    };
  }

        <div><span>P/L realizzato stimato</span><b class="${cls(net)}">${fUsd(net, true)}</b><small>lordo ${fUsd(rd.gross, true)} · costi ${fUsd(rd.fee + d.fund)}</small></div>
        <div><span>resta aperta</span><b>${rd.full ? "nulla" : fQty(rd.rest) + " " + esc(pos.asset)}</b><small>${rd.full ? "la posizione passa nelle chiuse" : "margine " + fUsd(rd.marginRest) + " · medio " + fPx(st.avg)}</small></div>
        <div><span>commissione stimata</span><b>${fUsd(rd.fee)}</b><small>${nf(d.rate || 0, 2)}% di ${fUsd(rd.value)}</small></div></div>

        return errOut(f, `Prezzo lontano oltre il 50% da quello attuale (${fPx(x.px)}): controlla e premi di nuovo.`, true); }
      const rd = d.rd;
      save(f, async () => {

  // modifica di un movimento già registrato (dallo Storico)
  function movForm(pos, tipo, mov) {
    if (!mov) return tipo === "aggiunta" ? addForm(pos) : redForm(pos);   // registrazioni nuove: moduli Aumenta e Riduci o chiudi
    const all = movsOf(pos.id), st = C.posState(all.filter(m => m.id !== mov.id), pos.lato, pos.leva);
    const edit = true; tipo = mov.tipo;
    const types = [[tipo, TIPO_L[tipo] || tipo]];
    const f = sheetForm(`Modifica ${(TIPO_L[tipo] || tipo).toLowerCase()} · ${pos.asset}`, `
      <p class="waNote">${esc(nameOf(pos.asset))} ${pos.lato} ${fLev(pos.leva)} · aperta <b>${fQty(st.qty)}</b> a <b>${fPx(st.avg)}</b> di media</p>
      ${types.length > 1 ? `<div class="grp">Tipo${segH("tipo", types, tipo)}</div>` : ""}
      <div data-fields>${movFields(tipo, mov, st, pos.leva)}</div>
      <div class="bar"><button type="button" class="waCta ter" data-x>Annulla</button><button type="submit" class="waCta pri">${edit ? "Salva modifiche" : "Salva"}</button></div>`);
    let cur = tipo, lastFar = null;
    const wire = () => { f.oninput = () => movPreview(f, cur, pos, st); movPreview(f, cur, pos, st); };
    segWire(f, (n, v) => { if (n !== "tipo") return; cur = v; const keep = { data: f.data.value, prezzo: f.prezzo.value };
      f.querySelector("[data-fields]").innerHTML = movFields(v, null, st, pos.leva); f.data.value = keep.data; f.prezzo.value = keep.prezzo; wire(); });
    wire();
    f.querySelector("[data-x]").onclick = () => window.closeSheet();
    f.onsubmit = e => {
      e.preventDefault();
      const q = pxOf(pos.asset), r = readMov(f, cur, +pos.leva || 1, cur === "riduzione" || cur === "chiusura" ? st : null, q && q.px, mov && mov.id);
      if (r.err) return errOut(f, r.err);
      if ((cur === "riduzione" || cur === "chiusura") && !edit && !(st.qty > 0)) return errOut(f, "La posizione non ha quantità aperta.");
      if (cur === "chiusura" && Math.abs(r.m.quantita - st.qty) > st.qty * 1e-6) return errOut(f, `La chiusura totale vale tutta la quantità aperta (${fQty(st.qty)}); per una parte scegli Riduzione.`);
      if (cur === "riduzione" && Math.abs(r.m.quantita - st.qty) <= st.qty * 1e-9) r.m.tipo = "chiusura";
      if (r.far && lastFar !== f.prezzo.value) { lastFar = f.prezzo.value; return errOut(f, `Prezzo lontano oltre il 50% da quello attuale (${fPx(q.px)}): controlla e premi di nuovo Salva.`, true); }
      if (r.m.margine === undefined) delete r.m.margine;
      // la posizione resta coerente: chiusa se la quantità arriva a zero, aperta altrimenti
      const after = C.posState((mov ? all.filter(m => m.id !== mov.id) : all).concat([Object.assign({}, r.m)]), pos.lato, pos.leva);
      if (edit && after.qOut > after.qIn * (1 + 1e-9)) return errOut(f, "Con questa modifica le uscite superano gli ingressi.");
      const stato = after.open ? "aperta" : after.qOut > 0 ? "chiusa" : "aperta";
      save(f, async () => {
        if (edit) await store.updMov(mov.id, r.m); else await store.addMov(Object.assign({ posizione_id: pos.id }, r.m));
        if (stato !== pos.stato) await store.updPos(pos.id, { stato });
      });
    };
  }
  function movsSheet(pos) {
    const box = document.createElement("div"); box.className = "waForm";
    const draw = () => {
      const M = movsOf(pos.id).slice().sort((a, b) => t0(a.data) - t0(b.data) || ORD[a.tipo] - ORD[b.tipo]);
      const st = C.posState(M, pos.lato, pos.leva);
      box.innerHTML = `<p class="waNote">${esc(nameOf(pos.asset))} ${pos.lato} ${fLev(pos.leva)} · ${esc(pos.mercato)} · ${esc(pos.exchange)} · ${esc(pos.strategia)}${pos.segnale_data ? " del " + fDay(pos.segnale_data) : ""}<br>
        ${st.open ? `Aperta <b>${fQty(st.qty)}</b> a <b>${fPx(st.avg)}</b>` : st.qOut > 0 ? `Chiusa · realizzato <b class="${cls(st.realized)}">${fUsd(st.realized, true)}</b>` : "Senza movimenti"}${st.fees ? ` · commissioni ${fUsd(st.fees)}` : ""}${st.funding ? ` · funding ${fUsd(st.funding)}` : ""}</p>
        <div class="waMovs">${M.map(m => `<div class="waMov" data-id="${esc(m.id)}"><div><b>${esc(TIPO_L[m.tipo] || m.tipo)} · ${fQty(+m.quantita)} a ${fPx(+m.prezzo)}</b>
          <small>${fDT(m.data)}${m.margine ? " · margine " + fUsd(+m.margine) : ""}${+m.commissioni ? " · comm. " + fUsd(+m.commissioni) : ""}${+m.funding ? " · funding " + fUsd(+m.funding) : ""}${m.note ? " · " + esc(m.note) : ""}</small></div>
          <span class="waAct">${cta("ter sm", "data-e", "edit", "Modifica", "Modifica", "Modifica movimento")}${cta("del sm", "data-d", "trash", "Elimina", "Elimina", "Elimina movimento")}</span></div>`).join("") || `<p class="waNote">Nessun movimento.</p>`}</div>
        <div class="waAct" data-pbar>${st.open ? cta("sec", "data-add", "plus", "Aumenta", "", "Aumenta la posizione") + cta("sec", "data-red", "minus", "Riduci o chiudi", "", "Riduci o chiudi la posizione") : ""}${cta("ter", "data-ep", "edit", "Modifica posizione")}${cta("del", "data-dp", "trash", "Elimina posizione")}</div>
        <p class="err" hidden></p>`;
      box.querySelectorAll(".waMov").forEach(r => {
        const m = M.find(x => x.id === r.dataset.id);
        r.querySelector("[data-e]").onclick = () => movForm(pos, m.tipo, m);
        r.querySelector("[data-d]").onclick = () => confirmBox(r, `Eliminare ${(TIPO_L[m.tipo] || m.tipo).toLowerCase()} del ${fDay(m.data)}? I calcoli si rifanno senza questo movimento.`, async () => {
          const rest = C.posState(M.filter(x => x.id !== m.id), pos.lato, pos.leva);
          if (rest.qOut > rest.qIn * (1 + 1e-9)) throw new Error("senza questo ingresso le uscite superano gli ingressi: elimina prima l'uscita");
          await store.delMov(m.id); const stato = rest.open || !rest.qOut ? "aperta" : "chiusa"; if (stato !== pos.stato) { await store.updPos(pos.id, { stato }); pos.stato = stato; }
        });
      });
      const q = s => box.querySelector(s);
      if (q("[data-add]")) q("[data-add]").onclick = () => addForm(pos);
      if (q("[data-red]")) q("[data-red]").onclick = () => redForm(pos);
      q("[data-ep]").onclick = () => posForm(pos);
      q("[data-dp]").onclick = () => confirmBox(q("[data-pbar]"), `Eliminare la posizione ${esc(pos.asset)} con tutti i suoi movimenti?`, async () => { await store.delPos(pos.id); window.closeSheet(); });
    };
    const confirmBox = (host, msg, fn) => {
      if (host.querySelector(".waConfirm")) return;
      const c = document.createElement("div"); c.className = "waConfirm";
      c.innerHTML = `<span>${msg}</span><button type="button" class="waCta ter sm" data-n>Annulla</button>${cta("del solid sm", "data-y", "trash", "Elimina", "", "Conferma eliminazione")}`;
      host.appendChild(c);
      c.querySelector("[data-n]").onclick = () => c.remove();
      c.querySelector("[data-y]").onclick = async () => { c.querySelectorAll("button").forEach(b => b.disabled = true);
        try { await fn(); [POS, MOV] = await store.list(); render(); if ($w("sheet").open && box.isConnected) draw(); }
        catch (e) { const er = box.querySelector(".err"); if (er) { er.hidden = false; er.textContent = sbErr(e); } c.remove(); } };
    };
    draw(); window.openSheet(`Storico · ${pos.asset}`, box);
  }
  function posForm(pos) {
    const f = sheetForm(`Modifica posizione · ${pos.asset}`, `
      <div class="grp">Strategia${segH("strategia", [["W3.2", "W3.2"], ["scanner", "Scanner"], ["fuori segnale", "Fuori segnale"]], pos.strategia)}</div>
      <div class="f2"><label>Leva${numIn("leva", pos.leva)}</label><label>Exchange<select name="exchange">${["Bitget", "OKX", "altro"].map(x => `<option${x === pos.exchange ? " selected" : ""}>${x}</option>`).join("")}</select></label></div>
      <label><span>Data del segnale <small>facoltativa</small></span><input type="date" name="segnale_data" value="${esc(pos.segnale_data || "")}"></label>
      <label>Note<textarea name="note" maxlength="500">${esc(pos.note || "")}</textarea></label>
      <p class="err" hidden></p>
      <div class="bar"><button type="button" class="waCta ter" data-x>Annulla</button><button type="submit" class="waCta pri">Salva</button></div>`);
    segWire(f); f.querySelector("[data-x]").onclick = () => window.closeSheet();
    f.onsubmit = e => { e.preventDefault();
      const lv = C.parseNum(f.leva.value), s = segVal(f, "strategia");
      if (!(lv >= 1 && lv <= 125)) return errOut(f, "Leva tra 1 e 125.");
      if (pos.mercato !== "perp" && lv !== 1) return errOut(f, "Spot e opzioni sono senza leva.");
      if (s === "W3.2" && !Wof(pos.asset)) return errOut(f, "W3.2 esiste solo per BTC ed ETH.");
      save(f, () => store.updPos(pos.id, { strategia: s, leva: lv, exchange: f.exchange.value, segnale_data: f.segnale_data.value || null, note: f.note.value.trim() || null })); };
  }
  function pxForm(a) {
    const m = getManual(a);
    const f = sheetForm(`Prezzo di ${a}`, `<p class="waNote">Prezzo pubblico non disponibile per ${esc(a)} (Binance e OKX). Inseriscilo a mano: resta su questo dispositivo finché non arriva quello pubblico.</p>
      <label><span>Prezzo attuale <small>$</small></span>${numIn("px", m && m.px)}</label><p class="err" hidden></p>
      <div class="bar"><button type="button" class="waCta ter" data-x>Annulla</button><button type="submit" class="waCta pri">Usa questo prezzo</button></div>`);
    f.querySelector("[data-x]").onclick = () => window.closeSheet();
    f.onsubmit = e => { e.preventDefault(); const v = C.parseNum(f.px.value); if (!(v > 0)) return errOut(f, "Prezzo non valido.");
      try { localStorage.setItem(manualKey(a), JSON.stringify({ px: v, t: Date.now() })); } catch (_) {}
      delete PX[a]; window.closeSheet(); render(); };
  }
  function capForm() {
    const f = sheetForm("Capitale di partenza", `<p class="waNote">Quanto hai messo sul conto all'inizio: serve per il valore del conto, le percentuali e il calo massimo. Salvato nel tuo account.</p>
      <label><span>Capitale <small>$</small></span>${numIn("cap", capital)}</label><p class="err" hidden></p>
      <div class="bar"><button type="button" class="waCta ter" data-x>Annulla</button><button type="submit" class="waCta pri">Salva</button></div>`);
    f.querySelector("[data-x]").onclick = () => window.closeSheet();
    f.onsubmit = e => { e.preventDefault(); const v = C.parseNum(f.cap.value); if (!(v > 0)) return errOut(f, "Capitale non valido.");
      save(f, async () => { user = await store.setCapital(v); capital = store.capital(user); }); };
  }

  // ---------------------------------------------------------------- ciclo di vita della pagina
  let timer = null, started = false;
  async function init() {
    if (started) return; started = true;
    if (!$w("waOut")) return;
    $w("waOut").onclick = async () => { try { if (store && !store.demo && window.RadarAuth) await window.RadarAuth.signOut(); else await store.logout(); } catch (_) {} user = null; POS = []; MOV = []; showLogin(); };
    $w("waNew").onclick = newForm;
    if (window.onRef) window.onRef(() => { if (!$w("v-wallet").hidden && POS.some(p => p.asset === "BTC")) render(); });
    const ok = await ensureStore().catch(e => e);
    if (ok === false) return showNotConfigured();
    if (ok instanceof Error) {
      started = false;
      gate(`<div class="card waGate"><h2>Accesso non disponibile</h2><p>Il modulo di accesso non si è caricato (${esc(ok.message)}).</p><button type="button" class="waCta ter" id="waRetry">Riprova</button></div>`);
      $w("waRetry").onclick = init; return;
    }
    try { user = user || await store.session(); } catch (_) { user = null; }
    if (user) await afterLogin(); else showLogin();
  }
  // archivio pronto (demo o Supabase) anche senza aprire la pagina: serve al Profilo (capitale, CSV). false = non configurato
  let storeP = null;
  function ensureStore() {
    if (store) return Promise.resolve(true);
    if (DEMO) { store = demoStore(); return Promise.resolve(true); }
    if (!CFG || !CFG.url || !CFG.anon) return Promise.resolve(false);
    return storeP || (storeP = getClient().then(c => {
      sb = c; store = SB;
      window.RadarAuth.onChange((ev, u) => {   // accesso e uscita dalla schermata globale o dal Profilo
        if (ev === "SIGNED_OUT" && user) { user = null; POS = []; MOV = []; showLogin(); }
        else if (u && !user && started && (ev === "SIGNED_IN" || ev === "SESSION")) { user = u; afterLogin(); }
        else if (u && user && ev === "USER_UPDATED") { user = u; capital = store.capital(user); render(); }
      });
      return true;
    }).catch(e => { storeP = null; throw e; }));
  }
  async function needUser() {
    if (!(await ensureStore())) throw new Error("Wallet non configurato");
    if (!user) { try { user = await store.session(); } catch (_) { user = null; } }
    if (!user && store.demo) user = await store.login("demo@radar.local", "");
    if (!user) throw new Error("accesso richiesto");
    capital = store.capital(user);
    return user;
  }
  // per il Profilo (radar/pages/profilo.html): capitale di partenza e dati da esportare, con lo stesso archivio della pagina
  window.WalletAPI = {
    async capital() { await needUser(); return capital; },
    async setCapital(v) { await needUser(); user = await store.setCapital(v); capital = store.capital(user); if (!$w("waApp").hidden) render(); return capital; },
    async rows() { await needUser(); const [P, M] = await store.list(); return { pos: P, mov: M }; },
    csv: (P, M) => C.toCSV(P, M),
    // aliquota sulle plusvalenze (Profilo → Il mio capitale): { value, custom }; setAliquota(null) torna alla predefinita
    async aliquota() { await needUser(); const a = aliqOf(user); return { value: C.taxRate(a, new Date().getFullYear()), custom: aliqCustom(a) }; },
    async setAliquota(v) { await needUser(); user = await store.setMeta({ aliquota: v == null ? null : +v }); if (!$w("waApp").hidden) render(); return this.aliquota(); },
  };
  window.PAGES = window.PAGES || {};
  window.PAGES.wallet = {
    init() { init(); },
    show() { if (timer) clearInterval(timer); timer = setInterval(() => { if (user && !document.hidden) refreshPx(); }, 30000); if (user) refreshPx(); },
    hide() { if (timer) clearInterval(timer); timer = null; },
  };
})();
</script>
