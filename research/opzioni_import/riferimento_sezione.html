  </div>
  <h3>Cosa succede alla scadenza</h3>
  <div class="scroll"><table><thead><tr><th>BTC alla scadenza</th><th>Variazione</th><th>Valore delle opzioni</th><th>Guadagno o perdita</th><th>Sul capitale</th></tr></thead><tbody>
  ${p.scenari.map(x => `<tr><td>${usd(x.btc)}</td><td>${x.mossa_pct === 0 ? "invariato" : pct(x.mossa_pct, 0)}</td><td>${usd(x.valore)}</td><td class="${cls(x.risultato)}">${sgn(x.risultato)}</td><td class="${cls(x.risultato)}">${pct(x.sul_capitale_pct)}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function posizione(p, s) {
  return `<div class="tiles">
    ${tile("Contratto", `${p.tipo === "call" ? "Call" : "Put"} ${usd(p.strike)}`, p.id)}
    ${tile("Scadenza", day(p.scadenza), `fra ${Math.round(p.giorni)} giorni`)}
    ${tile("Comprata a", usd(p.prezzo_in), `il ${day(p.entra)} · ${p.contratti} contratti`)}
    ${tile("Vale ora (denaro)", usd(p.prezzo_ora), `BTC ${usd(s.w3.prezzo)}`)}
    ${tile("Risultato", sgn(p.risultato), `${pct(p.risultato_pct)} del capitale`, cls(p.risultato))}
    ${tile("Spesa = perdita massima", usd(p.spesa), `${s.quota_pct}% di ${usd(s.capitale)}`)}
  </div>${p.nota ? `<p class="note">Nota: ${p.nota}.</p>` : ""}`;
}
function registro(r) {
  if (!r.length) return `<p class="note">Registro vuoto: la prima riga nasce al prossimo ingresso di W3.2.</p>`;
  return `<div class="scroll"><table><thead><tr><th class="l">Segnale</th><th class="l">Verso</th><th class="l">Contratto</th><th>Comprata a</th><th>Chiusa a</th><th class="l">Stato</th><th>Spesa</th><th>Risultato</th><th>Sul capitale</th></tr></thead><tbody>
  ${r.map(x => `<tr><td>${day(x.segnale)}</td><td class="l">${x.verso}</td><td class="l">${x.id || "–"}</td><td>${usd(x.prezzo_in)}</td><td>${usd(x.prezzo_out)}</td><td class="l">${x.stato}</td><td>${usd(x.spesa)}</td><td class="${cls(x.risultato)}">${sgn(x.risultato)}</td><td class="${cls(x.risultato)}">${pct(x.risultato_pct)}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function storico(t) {
  const a = t.reduce((m, x) => m * (1 + x.opzione_pct / 100), 1), b = t.reduce((m, x) => m * (1 + x.w32_pct / 200), 1);
  return `<details><summary>Storico dal 2018 con i prezzi veri (${t.length} operazioni)</summary>
  <p class="note">10.000 $ → ${usd(10000 * a)} con le opzioni al 5%; ${usd(10000 * b)} con W3.2 a metà dimensione. Operazioni in guadagno: ${Math.round(100 * t.filter(x => x.opzione_pct > 0).length / t.length)}%. Perdita peggiore: −5%.</p>
  <div class="scroll"><table><thead><tr><th>#</th><th class="l">Verso</th><th class="l">Entra</th><th class="l">Esce</th><th class="l">Contratto</th><th>Giorni</th><th>W3.2</th><th>Opzione, 5%</th></tr></thead><tbody>
  ${t.map(x => `<tr><td>${x.n}</td><td class="l">${x.verso}</td><td class="l">${day(x.entra)}</td><td class="l">${x.esce === "aperta" ? "aperta" : day(x.esce)}</td><td class="l">${x.contratto}</td><td>${x.giorni}</td><td class="${cls(x.w32_pct)}">${pct(x.w32_pct)}</td><td class="${cls(x.opzione_pct)}">${pct(x.opzione_pct)}</td></tr>`).join("")}
  </tbody></table></div></details>`;
}
function sezione(s, nome) {
  return `<section class="card"><h2>Opzioni · W3.2 a rischio definito</h2><p class="sub">${nome} · aggiornato ${s.aggiornato.replace("T", " ").slice(0, 16)} UTC · sulla carta, nessun ordine inviato</p>
  <div class="banner" style="margin-top:12px"><span class="tag ${s.azione}">${NOMI[s.azione]}</span><div><b>${s.titolo}</b><span>${s.testo}</span></div></div>
  ${s.posizione ? posizione(s.posizione, s) : ""}${s.proposta ? proposta(s.proposta, s) : ""}
  <h3>Registro su carta</h3>${registro(s.registro)}
  ${s.storico.length ? storico(s.storico) : ""}
  <h3>Regole</h3><ol>${s.regole.map(x => `<li>${x}</li>`).join("")}</ol>
  <p class="note">Nel backtest con prezzi veri dal 2018 questa strategia non rende più di W3.2: rende circa quanto W3.2 a metà dimensione, con la perdita per operazione fissata al 5%. Perde anche quando BTC resta fermo. Ricerca su dati storici, non una raccomandazione.</p>
  </section>`;
}
document.getElementById("out").innerHTML = `<div style="display:flex;flex-direction:column;gap:18px">${sezione(STATI.oggi, "Stato di oggi: posizione aperta")}${sezione(STATI.segnale, "Esempio: giorno di un segnale long")}</div>`;
</script>
</html>
